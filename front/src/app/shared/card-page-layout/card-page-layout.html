<div class="page-bg flex lg:h-screen ">
  <div class="page-wrapper flex flex-col" [class.wide]="wide()">
      <div class="header-wrapper">
        <ng-content class="stepper" select="[slot=stepper]" />
        <div class="page-header">
          <h1>{{ heading() }}</h1>
          <p>{{ subtitle() }}</p>
        </div>
      </div>
    <div class="page-card flex flex-col">
      <ng-content />
    </div>
  </div>
</div>
