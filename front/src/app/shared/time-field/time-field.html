<div class="field">
    <label>{{ label() }}</label>
    <div class="time-box"
         [class.has-error]="hasErrors">
        <input
            class="time-input"
            type="number"
            min="0"
            max="23"
            [value]="pad(hours())"
            (input)="onHoursInput($event)"
            (blur)="onHoursBlur($event)"
        />
        <span class="colon">:</span>
        <input
            class="time-input"
            type="number"
            min="0"
            max="59"
            [value]="pad(minutes())"
            (input)="onMinutesInput($event)"
            (blur)="onMinutesBlur($event)"
        />
    </div>
    <div class="flex justify-between items-center">
        <span class="field-error" [class.invisible]="!hasErrors">
            Time should be in the future
        </span>
    </div>
</div>
