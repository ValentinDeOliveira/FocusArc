<div class="time-duration-row">
    <app-time-field label="Start time" (timeChange)="startTime.set($event)" />

    <!-- Desktop: preset chips -->
    <div class="duration-wrapper duration-desktop">
        <label>Duration</label>
        <div class="duration-row">
            <div class="duration-presets">
                @for (preset of durationPresets; track preset) {
                    <button
                        class="preset-chip"
                        [class.active]="!displayCustom() && duration() === preset"
                        (click)="onClickPreset(preset)">
                        {{ preset }}m
                    </button>
                }
                @if (!displayCustom()) {
                    <button class="preset-chip" (click)="onClickCustom()">
                        Custom
                    </button>
                }
            </div>
            @if (displayCustom()) {
                <app-number-field [defaultValue]="durationPresets[1]" [min]="5" [max]="480" [step]="5" [(value)]="duration" />
                <span class="duration-unit">min</span>
            }
        </div>
    </div>

    <!-- Mobile: mat-menu dropdown -->
    <div class="duration-wrapper duration-mobile">
        <label>Duration</label>
        <button class="mobile-trigger" [matMenuTriggerFor]="durationMenu">
            <svg class="clock-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>{{ duration() }}m</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <mat-menu #durationMenu="matMenu" class="duration-menu-panel">
            @for (preset of durationPresets; track preset) {
                <button mat-menu-item [class.option-active]="!displayCustom() && duration() === preset" (click)="selectPresetMobile(preset)">
                    {{ preset }}m
                </button>
            }
            <div class="custom-menu-row" (click)="$event.stopPropagation()">
                <span class="custom-label" [class.active]="displayCustom()">Custom</span>
                <input
                    class="custom-input"
                    type="number"
                    min="5"
                    max="480"
                    step="5"
                    [value]="displayCustom() ? duration() : durationPresets[1]"
                    (input)="onCustomInput($any($event.target).value)"
                />
                <span class="custom-unit">min</span>
            </div>
        </mat-menu>
    </div>
</div>
