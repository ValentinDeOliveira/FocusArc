<div class="recurrence">
    <label>Recurrence</label>
    <div class="pill-group">
        @for (option of options; track option) {
            <button
                class="pill"
                [class.active]="selected() === option"
                (click)="selected.set(option)"
            >{{ RecurrenceLabel[option] }}</button>
        }
    </div>

    @if (selected() === RecurrenceType.DAYS_OF_WEEK) {
        <div class="days-section">
            <label>Days</label>
            <div class="day-group">
                @for (day of days; track day) {
                    <button
                        class="day-pill"
                        [class.active]="selectedDays().has(day)"
                        (click)="toggleDay(day)">
                        {{ day }}
                    </button>
                }
            </div>
        </div>
    } @else if (selected() === RecurrenceType.EVERY_N_DAYS) {
        <div class="n-days-recurrence">
            <span>Every</span>
            <input type="number" max="6" min="1" [value]="everyNDays()" (change)="everyNDays.set(+$any($event.target).value)" style="width: 72px;" />
            <span>days</span>
        </div>
    }

    <div class="time-duration-row">
        <app-time-field label="Start time" (timeChange)="startTime.set($event)" />

        <div class="duration-wrapper">
            <label>Duration</label>
            <div class="duration-row">
                <app-number-field [min]="5" [max]="480" [step]="5" [(value)]="duration" />
                <span class="duration-unit">min</span>
                <div class="duration-presets">
                    @for (preset of durationPresets; track preset) {
                        <button
                            class="preset-chip"
                            [class.active]="duration() === preset"
                            (click)="duration.set(preset)"
                        >{{ preset }}m</button>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
