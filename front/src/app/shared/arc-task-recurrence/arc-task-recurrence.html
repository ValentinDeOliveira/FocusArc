<div class="recurrence">
    <label>Recurrence</label>
    <div class="pill-group">
        @for (option of options; track option) {
            <button
                class="pill"
                [class.active]="selected() === option"
                (click)="selected.set(option)"
            >
                {{ RecurrenceLabel[option] }}
            </button>
        }
    </div>

    @if (selected() === RecurrenceType.DAYS_OF_WEEK) {
        <div class="days-section">
            <label>Days</label>
            <div class="day-group">
                @for (day of days; track day) {
                    <button
                        class="day-pill"
                        [class.active]="selectedDays().has(day)"
                        (click)="toggleDay(day)">
                        {{ day }}
                    </button>
                }
            </div>
        </div>
    } @else if (selected() === RecurrenceType.EVERY_N_DAYS) {
        <div class="n-days-recurrence">
            <span>Every</span>
            <app-number-field [min]="1" [max]="6" [(value)]="everyNDays" (change)="everyNDays.set(+$any($event.target).value)" />
            <span>days</span>
        </div>
    }

    <app-task-time-duration [(startTime)]="startTime" [(duration)]="duration" />
</div>
