<button class="trigger" (click)="$event.stopPropagation(); isOpen = !isOpen">
    <app-tag-dot [tag]="selectedTag"/>
</button>

@if (isOpen) {
    <div class="popup">
        <button class="dot-btn" (click)="select()">
            <app-tag-dot/>
        </button>
        @for (tag of tagStore.all(); track tag.id) {
            <button class="dot-btn" [title]="tag.label" (click)="select(tag)">
                <app-tag-dot [tag]="tag"/>
            </button>
        }
    </div>
}
