<app-task-row class="hoverable">
    <app-tag-picker [selectedTag]="tag" (tagChange)="updateTag($event)"/>
    <div class="task-info">
        <span class="task-name" [class.line-through]="isTaskEnded(task)">{{ task.name }}</span>
        <span class="task-time">{{ formatTimeHHmm(task.startAt) + ' - ' + formatTimeHHmm(task.endAt) }}</span>
    </div>
    <app-task-status-badge [status]="task.status"/>
    <span class="task-duration">{{ formatMinutes(task.estimatedMinutes) }}</span>
    <ng-content/>
</app-task-row>
