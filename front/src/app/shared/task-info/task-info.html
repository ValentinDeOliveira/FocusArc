<div class="task-card">
    <div class="tag-indicator" [style.background-color]="tag() ? tagColor(tag()!.color) : 'transparent'"></div>
    <div class="task-info">
        <span class="task-name" [class.line-through]="strikethrough()">{{ name() }}</span>
        <div class="task-meta">
            <span class="task-summary">{{ summary() }}</span>
            @if (tag()) {
                <app-tag-pill [tag]="tag()!"/>
            }
        </div>
    </div>

    <ng-content/>
</div>
