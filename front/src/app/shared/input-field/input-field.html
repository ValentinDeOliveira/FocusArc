<div class="field">
    <label [for]="effectiveId()">{{ label() }}</label>
    <input
        [id]="effectiveId()"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        [class.has-error]="error()"
        (input)="onInput($any($event.target).value)"
        [maxLength]="maxLength()"
    />
    <div class="bottom-field-container">
        @if (error()) {
            <span class="field-error">{{ error() }}</span>
        } @else {
            <span style="flex: 1;"></span>
        }
        <app-char-counter [current]="currentLength()" [max]="maxLength()" />
    </div>
</div>
