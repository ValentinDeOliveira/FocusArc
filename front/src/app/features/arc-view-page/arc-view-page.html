<div class="layout flex flex-col md:flex-row">
    <div class="main-content flex flex-col">
        <div class="back-btn-wrap self-start">
            <app-primary-btn ghost routerLink="/">
                <span class="material-icons">arrow_back</span> Home
            </app-primary-btn>
        </div>
        <h1 class="arc-title">{{ arcSummary?.name }}</h1>
        @for (chapter of chapters; track chapter.id; let i = $index) {
            <app-arc-view-chapter
                [chapter]="chapter"
                [isChapterExpanded]="i === expandedChapterIndex"
                [isOn2Years]="isOn2Years"
            />
        }
    </div>

    <aside class="sidebar flex items-center md:flex-col md:items-start md:sticky md:top-0 md:h-screen md:justify-start">
        <app-arc-donut-chart class="w-1/2 md:w-full" [counts]="chapterCounts" />
        <div class="stats-wrapper flex flex-col w-1/2 md:w-full">
            <app-arc-tag-stats [tagStats]="tagStats()" />
            <app-arc-task-stats [taskStats]="taskStats()"/>
        </div>
    </aside>
</div>
