<mat-card class="arc-card-container">
    <div class="image-wrapper">
        <img class="block" ngSrc="/arc-background.png" alt="arc-background" height="768" width="1536" priority/>
        <div class="card-header flex flex-col justify-start">
            <span class="current-arc-label">Current Arc</span>
            <span class="arc-name">{{ name() }}</span>
            <div class="arc-date flex items-center">
                <mat-icon class="calendar-icon">calendar_today</mat-icon>
                <span>{{ formatDateShort(arc().startDate) }} → {{ formatDateShort(arc().endDate) }}</span>
            </div>
        </div>
    </div>
    <div class="content-container flex flex-col">
        <div class="progress-section flex flex-col">
            <div class="progress-header flex justify-between items-center">
                @if (nbChapterTotal() > 0) {
                    <span class="chapters-text">{{ nbChapterCompleted() }} / {{ nbChapterTotal() }} chapters</span>
                } @else {
                    <span class="chapters-text">No chapters yet</span>
                }
                <span class="progress-percent">{{ progress }}%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" [style.width.%]="progress"></div>
            </div>
        </div>
        <mat-card-actions class="button-container">
            <app-primary-btn [fullWidth]="true" [light]="true" routerLink="/arc">
                View arc
            </app-primary-btn>
        </mat-card-actions>
    </div>
</mat-card>
