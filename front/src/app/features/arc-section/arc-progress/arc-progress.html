@if (arc() && contextStore.arcSummary()) {
    <div class="wrapper">
        <app-arc-card-container
            [arc]="arc()!"
            [nbChapterCompleted]="contextStore.arcSummary()!.nbChapterCompleted"
            [nbChapterTotal]="getNbTotalChapter()"/>
        <app-arc-progress-stats [arc]="arc()!" [arcSummary]="contextStore.arcSummary()!"/>
    </div>
}
