@if (!isTaskCreation) {
    <app-task-row class="centered">
        <app-primary-btn (click)="addTask()">
            <mat-icon>add</mat-icon>
        </app-primary-btn>
    </app-task-row>
} @else {
    <app-task-row>
        <app-tag-picker [selectedTag]="selectedTag" (tagChange)="onTagChange($event)"/>
        <app-task-info-edit
            (nameChange)="name = $event"
            (scheduledAtChange)="scheduledAt = $event"
            (estimatedMinutesChange)="estimatedMinutes = $event"
        />
        <button class="cancel-btn" (click)="cancel()">
            <mat-icon>close</mat-icon>
        </button>
        <app-primary-btn (click)="confirm()">Add</app-primary-btn>
    </app-task-row>
}
