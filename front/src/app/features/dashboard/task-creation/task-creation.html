@if (!isTaskCreation) {
    <button class="add-task-btn" (click)="addTask()"><mat-icon>add</mat-icon> Add task</button>
} @else {
    <app-task-row>
        <app-task-name-field (valueChange)="nameChange.emit($event)" />
        <app-task-time-duration/>
        <app-tag-selector/>
        <button class="cancel-btn" (click)="cancel()">
            <mat-icon>close</mat-icon>
        </button>
        <app-primary-btn (click)="confirm()">Add</app-primary-btn>
    </app-task-row>
}
