<div>
    <div>
        <h2 class="today-title">Today - {{ todayDate() }}</h2>
        @if (chapterSummary()) {
            <span class="today-subtitle">{{ getPlannedTime() }} planned • {{tasks().length}} tasks</span>
        }
    </div>
    @for (task of tasks(); track task.id) {
        <app-dashboard-task [task]="task" />
        <hr>
    }
</div>
