<div>
    <div>
        <h2 class="today-title">Today - {{ todayDate() }}</h2>
        @if (chapterSummary()) {
            <div class="today-subtitle">
                <span>{{ getPlannedTime() }} planned</span>
                <span>•</span>
                <span>{{tasks().length}} tasks</span>
                <span>•</span>
                <span class="completed-tasks">{{getNumberOfCompletedTasks}} completed</span>
            </div>
        }
    </div>
    @if (activeTask()) {
        <app-dashboard-task-timer [task]="activeTask()!" (done)="onTaskDone($event)" />
    }
    <div class="task-list-card">
        @for (task of tasks(); track task.id) {
            <app-dashboard-task [task]="task" [tag]="tagStore.byId(task.tagId)!" [hasActiveTask]="!!activeTask()" (started)="setActiveTask($event)" />
            <div class="task-divider"></div>
        }
        <app-task-creation (taskCreated)="onTaskCreated($event)"/>
    </div>
</div>
