<div>
    <div>
        <h2 class="today-title">Today - {{ todayDate() }}</h2>
        @if (chapterSummary()) {
            <div class="today-subtitle">
                <span >{{ getPlannedTime() }} planned</span>
                <span> • </span>
                <span>{{tasks().length}} tasks</span>
                <span> • </span>
                <span class="completed-tasks">{{getNumberOfCompletedTasks}} task completed</span>
            </div>
        }
    </div>
    @if (activeTask()) {
        <app-dashboard-task-timer [task]="activeTask()!" (done)="onTaskDone($event)" />
    }
    @for (task of tasks(); track task.id) {
        <app-dashboard-task [task]="task" (started)="setActiveTask($event)" />
        <hr>
    }
</div>
