<app-card-page-layout
    title="Create your Arc"
    subtitle="Define a goal and time span to start tracking your focus."
    wide
>
    <app-arc-creation-stepper slot="stepper" [activeStep]="2" />
    <div class="card-header">
        <h2 class="title">Set up your routine</h2>
        <p class="subtitle">Add recurring tasks that repeat inside your arc. You can always edit these later.</p>
    </div>

    <div class="fields-row">
        <app-input-field label="Task name" type="text" placeholder="e.g Morning run, Deep work block..."/>
        <app-input-field label="Tag (optional)" id="task-tag" type="text" placeholder="Select or create a tag"/>
    </div>

    <app-arc-task-recurrence/>

    <app-primary-btn [fullWidth]="true">
        Continue to tasks
        <mat-icon>arrow_right_alt</mat-icon>
    </app-primary-btn>
</app-card-page-layout>
