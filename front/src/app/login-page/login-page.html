<div class="login-bg">
  <div class="login-wrapper">

    <div class="login-header">
      <h1>{{ activeTab() === 'login' ? 'Welcome back' : 'Create account' }}</h1>
      <p>{{ activeTab() === 'login' ? 'Sign in to continue tracking your focus.' : 'Start tracking your focus today.' }}</p>
    </div>

    <div class="login-card">
      <div class="tab-switcher">
        <button class="tab-btn" [class.active]="activeTab() === 'login'" (click)="setTab('login')">
          Sign in
        </button>
        <button class="tab-btn" [class.active]="activeTab() === 'register'" (click)="setTab('register')">
          Create account
        </button>
      </div>

      @if (activeTab() === 'login') {
        <app-login-form />
      } @else {
        <app-register-form />
      }
    </div>

  </div>
</div>
