@if (error()) {
  <p class="form-error-banner">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <app-form-input-field
    label="Name"
    inputId="reg-name"
    placeholder="Your name"
    autocomplete="name"
    [control]="$any(form.get('name'))"
    errorMessage="Name is required."
  />

  <app-form-input-field
    label="Email address"
    inputId="reg-email"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    [control]="$any(form.get('email'))"
    errorMessage="Enter a valid email."
  />

  <app-password-field
    inputId="reg-password"
    placeholder="Min. 8 characters"
    [control]="$any(form.get('password'))"
    autocomplete="new-password"
  />

  <button type="submit" class="submit-btn" [disabled]="loading()">
    {{ loading() ? 'Creating account…' : 'Create account' }}
  </button>
</form>


<div class="divider"><span>or continue with</span></div>

<div class="social-row">
  <div #googleBtnContainer class="google-btn-container"></div>
</div>
