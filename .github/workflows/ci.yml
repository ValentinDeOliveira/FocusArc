name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      # Add admin user to MongoDB to allow authentication for tests
      - name: Setup Mongo User
        run: |
          docker exec $(docker ps -q -f ancestor=mongo:latest) \
            mongosh --eval "db.getSiblingDB('admin').createUser({user:'admin', pwd:'admin123', roles:[{role:'root', db:'admin'}]})"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        working-directory: back

      - name: Build and test with Maven
        run: ./mvnw clean verify -B
        working-directory: back

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco

  build-native-image:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        working-directory: back

      - name: Build native image
        working-directory: back
        run: |
          ./mvnw -Pnative spring-boot:build-image \
            -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/focusarc:latest

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/focusarc:latest